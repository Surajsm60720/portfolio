name: Sync GitHub data

# The Rhythm chart and the release half of the Ship log are generated from
# GitHub rather than hand-maintained. The previous version of this site went
# nine months stale because every number on it had to be updated by hand;
# this is the structural fix for that.
#
# Data is committed rather than fetched at build or at runtime, so the build
# still needs no network, nothing extra ships to the client, and every change
# to the numbers is a reviewable diff.

on:
  schedule:
    # 00:30 UTC Monday — 06:00 Monday in Bengaluru.
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache repository mirrors
        uses: actions/cache@v4
        with:
          path: .repo-cache
          key: repo-mirrors-${{ github.run_id }}
          restore-keys: repo-mirrors-

      - name: Regenerate commit hours and releases
        env:
          # Raises the API allowance from 60/hour to 5,000 and needs no
          # configuration — Actions provides it.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-github.mjs

      - name: Refuse to commit an empty or broken dataset
        run: |
          total=$(node -p "require('./lib/commit-hours.json').total")
          repos=$(node -p "require('./lib/commit-hours.json').repos.length")
          if [ "$total" -lt 50 ] || [ "$repos" -lt 3 ]; then
            echo "::error::Refusing to commit: total=$total repos=$repos looks wrong."
            echo "A partial clone failure would otherwise silently erase the chart."
            exit 1
          fi
          echo "total=$total repos=$repos — sane"

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- lib/commit-hours.json lib/ship-log.json; then
            echo "No change this week."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/commit-hours.json lib/ship-log.json
          git commit -m "chore(data): weekly GitHub sync

          Regenerated by .github/workflows/sync-github.yml. Commit hours are
          read from cloned history so the author's timezone offset survives;
          the REST API discards it."
          git push
